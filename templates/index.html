<!DOCTYPE html>

<html>

<head>

<title>
AI College Admission System
</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="overlay">


<div class="header">


<h1>
🎓 AI College Admission Approval System
</h1>


<h2>
Machine Learning Admission Prediction
</h2>


<p>
Developer: Manya Singla
</p>


<h3>
Student Prediction Form Loading Test
</h3>


</div>


</div>

 <!-- ============================= -->
<!-- STUDENT DETAILS BUTTONS -->
<!-- ============================= -->


<div class="menu">


<button onclick="showSection('basic')">
👤 Basic Details
</button>


<button onclick="showSection('academic')">
📚 Academic Analysis
</button>


<button onclick="showSection('entrance')">
🎯 Entrance Analysis
</button>


<button onclick="showSection('college')">
🏫 College Matching
</button>


<button onclick="showSection('verification')">
✅ Verification
</button>


<button onclick="showSection('extra')">
💰 Scholarship Details
</button>


</div>





<!-- ============================= -->
<!-- BASIC DETAILS -->
<!-- ============================= -->


<div id="basic" class="section">


<h2>
👤 Student Basic Details
</h2>


<input id="Age" placeholder="Age">


<select id="Category">

<option>ST</option>

<option>OBC</option>
<option>SC</option>

<option>EWS</option>

<option>General</option>

</select>


<input id="Family_Income"
placeholder="Family Income">


</div>





<!-- ============================= -->
<!-- ACADEMIC DETAILS -->
<!-- ============================= -->


<div id="academic" class="section hidden">


<h2>
📚 Academic Details
</h2>


<input id="Class10_%"
placeholder="Class 10 Percentage">


<input id="Class12_%"
placeholder="Class 12 Percentage">


<input id="PCM_%"
placeholder="PCM Percentage">


</div>





<!-- ============================= -->
<!-- ENTRANCE DETAILS -->
<!-- ============================= -->


<div id="entrance" class="section hidden">


<h2>
🎯 Entrance Exam Details
</h2>


<select id="Entrance_Exam">
    <option>CUET</option>
    <option>JEE MAIN</option>
</select>


<input id="JEE_Percentile"
placeholder="JEE Percentile">


<input id="JEE_Rank"
placeholder="JEE Rank">


<input id="CUET_Score"
placeholder="CUET Score">


</div>





<!-- ============================= -->
<!-- COLLEGE DETAILS -->
<!-- ============================= -->


<div id="college" class="section hidden">


<h2>
🏫 College Preference Details
</h2>


<select id="Preferred_Branch">
    <option>AI</option>
    <option>CIVIL</option>
    <option>Mechanical</option>
    <option>CSE</option>
    <option>ECE</option>
</select>

<select id="Preferred_College">
    <option>NIT Trichy</option>
    <option>Chitkara</option>
    <option>Thapar</option>
    <option>IIT Delhi</option>
</select>


<select id="College_Type">
    <option>Govt</option>
    <option>Private</option>
</select>


<input id="NIRF_Rank"
placeholder="NIRF Rank">


<select id="College_Tier">
    <option>Tier 1</option>
    <option>Tier 2</option>
    <option>Tier 3</option>
</select>


<input id="Branch_Cutoff_Rank"
placeholder="Branch Cutoff Rank">


<input id="Available_Seats"
placeholder="Available Seats">


<select id="Reservation_Quota">
    <option>SC</option>
    <option>OBC</option>
    <option>EWS</option>
    <option>ST</option>
    <option>General</option>
</select>

</div>





<!-- ============================= -->
<!-- VERIFICATION DETAILS -->
<!-- ============================= -->


<div id="verification" class="section hidden">


<h2>
✅ Verification Details
</h2>


<select id="Documents_Verified">
    <option>No</option>
    <option>Yes</option>
</select>

<input id="Interview_Score"
placeholder="Interview Score">


<input id="Communication_Score"
placeholder="Communication Score">


<input id="Aptitude_Score"
placeholder="Aptitude Score">


</div>





<!-- ============================= -->
<!-- EXTRA DETAILS -->
<!-- ============================= -->


<div id="extra" class="section hidden">


<h2>
💰 Scholarship Details
</h2>


<select id="Scholarship_Applied">
    <option>Yes</option>
    <option>No</option>
</select>


<select id="Scholarship_Eligibility">
    <option>Eligible</option>
    <option>Not Eligible</option>
</select>

<select id="Hostel_Required">
    <option>Yes</option>
    <option>No</option>
</select>


<input id="Admission_Probability"
placeholder="Previous Admission Probability">


<input id="Tuition_Fee"
placeholder="Tuition Fee">


</div>





<button class="predict-btn" onclick="predictAdmission()">
    🚀 Predict Admission
</button>



<div class="result-box">

    <div id="result"></div>

</div>


<script src="/static/script.js"></script>


</body>

</html>
