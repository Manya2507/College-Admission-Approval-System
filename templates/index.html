<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI College Admission Approval System</title>

    <link rel="stylesheet" href="/static/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="overlay">

<!-- ===================================================== -->
<!-- PIET HEADER -->
<!-- ===================================================== -->

<div class="header">

<div class="college-header">

<img src="/static/images/piet_logo.png"
class="college-logo">

<div>

<h1 class="college-name">

PANIPAT INSTITUTE OF ENGINEERING <br>
AND TECHNOLOGY

</h1>

<div class="location-line">

<hr>

<span>
📍 Panipat, Haryana
</span>

<hr>

</div>

</div>

</div>

<h2 class="project-title">

🎓 AI College Admission Approval System

</h2>

<h3 class="project-subtitle">

Machine Learning Admission Prediction

</h3>

<p class="developer">

Developer :
<b>Manya Singla</b>

</p>

</div>

<!-- ===================================================== -->
<!-- MENU -->
<!-- ===================================================== -->

<div class="menu">

<button onclick="showSection('basic')">
👤 Basic Details
</button>

<button onclick="showSection('academic')">
📚 Academic Analysis
</button>

<button onclick="showSection('entrance')">
🎯 Entrance Analysis
</button>

<button onclick="showSection('college')">
🏫 College Matching
</button>

<button onclick="showSection('verification')">
✅ Verification
</button>

<button onclick="showSection('extra')">
💰 Scholarship
</button>

<button onclick="showSection('others')">
📌 Others
</button>

</div>

<!-- ===================================================== -->
<!-- BASIC DETAILS -->
<!-- ===================================================== -->

<div id="basic" class="section">

<div class="section-title">

<hr>

<h2>
👤 Student Basic Details
</h2>

<hr>

</div>

<div class="grid">

<div class="form-group">

<label>Age</label>

<input
id="Age"
placeholder="Enter Age">

</div>

<div class="form-group">

<label>Category</label>

<select id="Category">

<option>General</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>EWS</option>

</select>

</div>

<div class="form-group">

<label>Family Income</label>

<input
id="Family_Income"
placeholder="Enter Family Income">

</div>

</div>

</div>

<!-- ===================================================== -->
<!-- ACADEMIC -->
<!-- ===================================================== -->

<div id="academic" class="section hidden">

<!-- Part 2 -->

</div>

<!-- ===================================================== -->
<!-- ENTRANCE -->
<!-- ===================================================== -->

<div id="entrance" class="section hidden">

<!-- Part 2 -->

</div>

<!-- ===================================================== -->
<!-- COLLEGE -->
<!-- ===================================================== -->

<div id="college" class="section hidden">

<!-- Part 2 -->

</div>

<!-- ===================================================== -->
<!-- VERIFICATION -->
<!-- ===================================================== -->

<div id="verification" class="section hidden">

<!-- Part 2 -->

</div>

<!-- ===================================================== -->
<!-- SCHOLARSHIP -->
<!-- ===================================================== -->

<div id="extra" class="section hidden">

<!-- Part 2 -->

</div>

<!-- ===================================================== -->
<!-- OTHERS -->
<!-- ===================================================== -->

<div id="others" class="section hidden">

<!-- Part 2 -->

</div>
<!-- ===================================================== -->
<!-- ACADEMIC DETAILS -->
<!-- ===================================================== -->

<div id="academic" class="section hidden">

<div class="section-title">

<hr>

<h2>
📚 Academic Details
</h2>

<hr>

</div>


<div class="grid">


<div class="form-group">

<label>
Class 10 Percentage
</label>

<input 
id="Class10_Percentage"
placeholder="Enter Class 10 Percentage">

</div>



<div class="form-group">

<label>
Class 12 Percentage
</label>

<input 
id="Class12_Percentage"
placeholder="Enter Class 12 Percentage">

</div>



<div class="form-group">

<label>
PCM Percentage
</label>

<input 
id="PCM_Percentage"
placeholder="Enter PCM Percentage">

</div>


<div class="form-group">

<label>
Previous Academic Score
</label>

<input
id="Previous_Academic_Score"
placeholder="Enter Score">

</div>


<div class="form-group">

<label>
Backlogs
</label>

<select id="Backlogs">

<option>No</option>
<option>Yes</option>

</select>

</div>


<div class="form-group">

<label>
Attendance Percentage
</label>

<input
id="Attendance_Percentage"
placeholder="Enter Attendance">

</div>


</div>

</div>





<!-- ===================================================== -->
<!-- ENTRANCE DETAILS -->
<!-- ===================================================== -->


<div id="entrance" class="section hidden">


<div class="section-title">

<hr>

<h2>
🎯 Entrance Exam Details
</h2>

<hr>

</div>



<div class="grid">


<div class="form-group">

<label>
Entrance Exam
</label>

<select id="Entrance_Exam">

<option>JEE Main</option>

<option>CUET</option>

<option>None</option>

</select>

</div>




<div class="form-group">

<label>
JEE Percentile
</label>

<input
id="JEE_Percentile"
placeholder="Enter JEE Percentile">

</div>




<div class="form-group">

<label>
JEE Rank
</label>

<input
id="JEE_Rank"
placeholder="Enter JEE Rank">

</div>




<div class="form-group">

<label>
CUET Score
</label>

<input
id="CUET_Score"
placeholder="Enter CUET Score">

</div>



<div class="form-group">

<label>
Entrance Qualified
</label>

<select id="Entrance_Qualified">

<option>Yes</option>

<option>No</option>

</select>

</div>


</div>


</div>






<!-- ===================================================== -->
<!-- COLLEGE PREFERENCE -->
<!-- ===================================================== -->


<div id="college" class="section hidden">


<div class="section-title">

<hr>

<h2>
🏫 College Matching Details
</h2>

<hr>

</div>



<div class="grid">


<div class="form-group">

<label>
Preferred Branch
</label>

<select id="Preferred_Branch">

<option>CSE</option>

<option>AIML</option>

<option>ECE</option>

<option>Mechanical</option>

<option>Civil</option>

</select>

</div>



<div class="form-group">

<label>
Preferred College
</label>

<select id="Preferred_College">

<option>PIET</option>

<option>NIT</option>

<option>IIT</option>

<option>Private College</option>

</select>

</div>




<div class="form-group">

<label>
College Type
</label>

<select id="College_Type">

<option>Private</option>

<option>Government</option>

</select>

</div>




<div class="form-group">

<label>
NIRF Rank
</label>

<input
id="NIRF_Rank"
placeholder="Enter NIRF Rank">

</div>




<div class="form-group">

<label>
College Tier
</label>

<select id="College_Tier">

<option>Tier 1</option>

<option>Tier 2</option>

<option>Tier 3</option>

</select>

</div>




<div class="form-group">

<label>
Available Seats
</label>

<input
id="Available_Seats"
placeholder="Enter Available Seats">

</div>



<div class="form-group">

<label>
Branch Cutoff Rank
</label>

<input
id="Branch_Cutoff_Rank"
placeholder="Enter Cutoff Rank">

</div>



<div class="form-group">

<label>
Reservation Quota
</label>

<select id="Reservation_Quota">

<option>General</option>

<option>OBC</option>

<option>SC</option>

<option>ST</option>

<option>EWS</option>

</select>

</div>


</div>


</div>
<!-- ===================================================== -->
<!-- PREDICT BUTTON -->
<!-- ===================================================== -->

<div class="predict-container">

<button
class="predict-btn"
onclick="predictAdmission()">

🚀 Predict Admission

</button>

</div>

<!-- ===================================================== -->
<!-- RESULT -->
<!-- ===================================================== -->

<div class="result-box">

<div id="result"></div>

</div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
